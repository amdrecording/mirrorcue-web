<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MirrorCue Web</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  button { font: inherit; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.active { display: block; }

  /* ---------- Library ---------- */
  #library { background: #111; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: env(safe-area-inset-top) 0 40px; }
  #library header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 8px; }
  #library h1 { font-size: 28px; margin: 0; }
  .btn { background: #2a2a2e; color: #fff; border: 0; border-radius: 12px; padding: 10px 16px; font-size: 16px; }
  .btn.primary { background: #ffd60a; color: #000; font-weight: 600; }
  .btn.danger { background: #5a1a1a; }
  .card { background: #1c1c1e; margin: 10px 16px; border-radius: 14px; padding: 14px 16px; }
  .card h3 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0 0 10px; color: #aaa; font-size: 14px; max-height: 3em; overflow: hidden; }
  .card .row { display: flex; gap: 8px; }
  #editor textarea { width: 100%; height: 55vh; background: #000; color: #fff; border: 1px solid #333; border-radius: 10px; padding: 12px; font-size: 16px; }
  #editor input { width: 100%; background: #000; color: #fff; border: 1px solid #333; border-radius: 10px; padding: 10px 12px; font-size: 18px; margin-bottom: 10px; }
  .hint { color: #888; font-size: 13px; margin: 6px 16px; }

  /* ---------- Prompter ---------- */
  #prompter { background: #000; }
  #stage { position: absolute; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top); overflow: hidden; }
  #box { position: absolute; left: 50%; top: 50%; transform-origin: center; }
  #frame { position: absolute; left: 0; top: 0; transform-origin: center; overflow: hidden; }
  #content { position: relative; width: 100%; padding: 0 16px; transition: transform 0.18s ease-out; will-change: transform; }
  #content.nolerp { transition: none; }
  .p { margin: 0; font-weight: 600; word-wrap: break-word; }
  .w { color: #fff; }
  .w.spoken { color: rgba(255,255,255,0.45); }
  .w.current { color: #ffd60a; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #overlay > * { pointer-events: auto; }
  #topbar { position: absolute; top: calc(env(safe-area-inset-top) + 8px); left: 12px; right: 12px; display: flex; justify-content: space-between; }
  #bottombar { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 12px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .round { width: 48px; height: 48px; border-radius: 24px; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 20px; }
  .round.on { background: #ffd60a; color: #000; }
  #controls { display: flex; gap: 14px; padding: 10px 18px; background: rgba(0,0,0,.5); border-radius: 40px; }
  #heard { font-size: 13px; color: rgba(255,255,255,.8); background: rgba(0,0,0,.5); padding: 4px 12px; border-radius: 20px; max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #heard.warn { color: #ffb347; white-space: normal; }
  #overlay.hidden { display: none; }

  /* ---------- Settings sheet ---------- */
  #settings { position: fixed; left: 0; right: 0; bottom: 0; max-height: 75vh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #1c1c1e; border-radius: 18px 18px 0 0; padding: 12px 18px calc(env(safe-area-inset-bottom) + 20px); display: none; z-index: 10; }
  #settings.open { display: block; }
  #settings h2 { font-size: 17px; margin: 6px 0 12px; display: flex; justify-content: space-between; align-items: center; }
  .setting { display: grid; grid-template-columns: 1fr 1.4fr; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #2a2a2e; font-size: 15px; }
  .setting input[type=range] { width: 100%; }
  .setting select { background: #2a2a2e; color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; font-size: 15px; }
  .toggle { justify-self: end; width: 52px; height: 32px; border-radius: 16px; background: #3a3a3c; border: 0; position: relative; }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #fff; transition: left .15s; }
  .toggle.on { background: #34c759; }
  .toggle.on::after { left: 23px; }
  .foot { color: #888; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>

<!-- ===================== LIBRARY ===================== -->
<section id="library" class="screen active">
  <header><h1>MirrorCue Web</h1><button class="btn primary" id="newBtn">+ New</button></header>
  <p class="hint">Tap a script to prompt. Voice-follow uses Safari's speech recognition (needs Wi-Fi). Turn Auto-Lock to Never while prompting.</p>
  <div id="list"></div>
</section>

<section id="editor" class="screen">
  <div style="padding: calc(env(safe-area-inset-top) + 14px) 16px 16px">
    <input id="titleInput" placeholder="Title">
    <textarea id="bodyInput" placeholder="Paste your script here. Each new line starts a paragraph."></textarea>
    <div style="display:flex; gap:10px; margin-top:12px">
      <button class="btn primary" id="saveBtn">Save</button>
      <button class="btn" id="cancelBtn">Cancel</button>
      <span style="flex:1"></span>
      <button class="btn danger" id="deleteBtn">Delete</button>
    </div>
  </div>
</section>

<!-- ===================== PROMPTER ===================== -->
<section id="prompter" class="screen">
  <div id="stage"><div id="box"><div id="frame"><div id="content"></div></div></div></div>
  <div id="overlay">
    <div id="topbar">
      <button class="round" id="closeBtn" title="Close">✕</button>
      <button class="round" id="restartBtn" title="Restart from top">↺</button>
    </div>
    <div id="bottombar">
      <div id="heard"></div>
      <div id="controls">
        <button class="round" id="listenBtn" title="Follow my voice">🎤</button>
        <button class="round" id="playBtn" title="Auto-scroll" style="display:none">▶</button>
        <button class="round" id="settingsBtn" title="Settings">⚙︎</button>
      </div>
    </div>
  </div>
  <div id="settings">
    <h2>Prompter settings <button class="btn" id="settingsDone">Done</button></h2>
    <div class="setting"><label>Text size <b id="v-font"></b></label><input type="range" id="s-font" min="8" max="90" step="1"></div>
    <div class="setting"><label>Line spacing <b id="v-spacing"></b></label><input type="range" id="s-spacing" min="-0.35" max="1" step="0.05"></div>
    <div class="setting"><label>Width <b id="v-width"></b></label><input type="range" id="s-width" min="0.3" max="1" step="0.05"></div>
    <div class="setting"><label>Height <b id="v-height"></b></label><input type="range" id="s-height" min="0.2" max="1" step="0.05"></div>
    <div class="setting"><label>Top offset <b id="v-top"></b></label><input type="range" id="s-top" min="0" max="0.7" step="0.02"></div>
    <div class="setting"><label>Side offset <b id="v-side"></b></label><input type="range" id="s-side" min="-0.5" max="0.5" step="0.02"></div>
    <div class="setting"><label>Reading line <b id="v-anchor"></b></label><input type="range" id="s-anchor" min="0" max="0.5" step="0.02"></div>
    <div class="setting"><label>Rotation</label><select id="s-rotation"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></div>
    <div class="setting"><label>Mirror flip</label><button class="toggle" id="s-mirror"></button></div>
    <div class="setting"><label>Center text</label><button class="toggle" id="s-center"></button></div>
    <div class="setting"><label>Voice commands</label><button class="toggle" id="s-commands"></button></div>
    <div class="setting"><label>Show heard words</label><button class="toggle" id="s-heard"></button></div>
    <div class="setting"><label>Manual speed <b id="v-speed"></b></label><input type="range" id="s-speed" min="10" max="200" step="5"></div>
    <p class="foot">Voice commands: say “go start”, “go end”, or “go back” (one paragraph). With voice-follow off, ▶ scrolls at the manual speed.</p>
  </div>
</section>

<script src="matcher.js"></script>
<script>
(function () {
  'use strict';
  const { ScriptMatcher, VoiceCommandDetector } = window.MirrorCueMatcher;
  const $ = id => document.getElementById(id);

  // ---------- persistence ----------
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  let scripts = load('mc.scripts', null);
  if (!scripts) {
    scripts = [{ id: String(Date.now()), title: 'Welcome',
      body: 'Welcome to MirrorCue Web. This is your teleprompter script.\nAs you speak, the page listens and scrolls to keep up with you. You can ad-lib a little and it will find its place again. If you start over from an earlier line, it will jump back and follow you from there.\nSay "go start" to jump to the beginning, "go end" for the end, or "go back" for the previous paragraph.' }];
    save('mc.scripts', scripts);
  }
  const settings = Object.assign({
    font: 24, spacing: 0.3, width: 1, height: 1, top: 0, side: 0, anchor: 0, rotation: 0,
    mirror: false, center: false, commands: true, heard: true, speed: 40, listen: true
  }, load('mc.settings', {}));
  const saveSettings = () => save('mc.settings', settings);

  // ---------- library ----------
  const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); };
  let editing = null;
  function renderList() {
    const list = $('list'); list.innerHTML = '';
    for (const s of scripts) {
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = `<h3></h3><p></p><div class="row"><button class="btn primary">Prompt</button><button class="btn">Edit</button></div>`;
      card.querySelector('h3').textContent = s.title || 'Untitled';
      card.querySelector('p').textContent = s.body.slice(0, 160);
      card.querySelectorAll('button')[0].onclick = () => openPrompter(s);
      card.querySelectorAll('button')[1].onclick = () => openEditor(s);
      list.appendChild(card);
    }
  }
  function openEditor(s) {
    editing = s; $('titleInput').value = s ? s.title : ''; $('bodyInput').value = s ? s.body : '';
    $('deleteBtn').style.display = s ? '' : 'none'; show('editor');
  }
  $('newBtn').onclick = () => openEditor(null);
  $('cancelBtn').onclick = () => show('library');
  $('saveBtn').onclick = () => {
    const title = $('titleInput').value.trim() || 'Untitled', body = $('bodyInput').value;
    if (!body.trim()) return;
    if (editing) { editing.title = title; editing.body = body; }
    else scripts.unshift({ id: String(Date.now()), title, body });
    save('mc.scripts', scripts); renderList(); show('library');
  };
  $('deleteBtn').onclick = () => {
    if (!editing || !confirm('Delete this script?')) return;
    scripts = scripts.filter(s => s !== editing); save('mc.scripts', scripts); renderList(); show('library');
  };
  renderList();

  // ---------- prompter state ----------
  let matcher = null, commands = new VoiceCommandDetector();
  let spans = [];          // word spans indexed by token
  let spokenIdx = -1;      // last spoken token
  let dragOffset = 0;      // manual drag / auto-scroll displacement
  let listening = false, autoScrolling = false, controlsVisible = true;
  let recognition = null, currentScript = null;

  function openPrompter(s) {
    currentScript = s;
    matcher = new ScriptMatcher(s.body); commands.reset();
    spokenIdx = -1; dragOffset = 0;
    buildContent(); show('prompter'); applySettings(); layout(false);
    if (settings.listen) startListening(); else updateListenUI();
    if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
  }

  function buildContent() {
    const content = $('content'); content.innerHTML = ''; spans = [];
    for (const cells of matcher.paragraphs) {
      const p = document.createElement('div'); p.className = 'p';
      cells.forEach((cell, i) => {
        const w = document.createElement('span'); w.className = 'w'; w.textContent = cell.text;
        if (cell.token != null) { w.dataset.t = cell.token; spans[cell.token] = w; }
        p.appendChild(w);
        if (i < cells.length - 1) p.appendChild(document.createTextNode(' '));
      });
      content.appendChild(p);
    }
  }

  // ---------- geometry ----------
  function applySettings() {
    const stage = $('stage'), vw = stage.clientWidth || window.innerWidth, vh = stage.clientHeight || window.innerHeight;
    const rot = Number(settings.rotation), swapped = rot % 180 !== 0;
    const boxW = swapped ? vh : vw, boxH = swapped ? vw : vh;
    const box = $('box');
    box.style.width = boxW + 'px'; box.style.height = boxH + 'px';
    box.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
    const frame = $('frame');
    const frameW = Math.round(boxW * settings.width);
    frame.style.width = frameW + 'px';
    // Side offset slides the block left (negative) or right (positive) from
    // center, clamped so it never leaves the screen.
    const leftPx = Math.max(0, Math.min(boxW - frameW, Math.round(boxW / 2 + boxW * settings.side - frameW / 2)));
    frame.style.left = leftPx + 'px';
    // Top offset pushes the whole text block down; height is measured from
    // there and can't run past the bottom edge.
    const topPx = Math.round(boxH * settings.top);
    frame.style.top = topPx + 'px';
    frame.style.height = Math.min(Math.round(boxH * settings.height), boxH - topPx) + 'px';
    frame.style.transform = `scaleX(${settings.mirror ? -1 : 1})`;
    const content = $('content');
    content.style.fontSize = settings.font + 'px';
    content.style.lineHeight = (1.2 + Math.max(-0.35, settings.spacing)) + '';
    content.style.textAlign = settings.center ? 'center' : 'left';
    document.querySelectorAll('.p').forEach(p => p.style.marginBottom = (settings.spacing > 0 ? settings.spacing * settings.font : 0) + 'px');
    $('heard').style.display = settings.heard ? '' : 'none';
    $('playBtn').style.display = listening ? 'none' : '';
    for (const [k, fmt] of [['font', v => v + 'px'], ['spacing', v => Math.round(v * 100) + '%'], ['width', v => Math.round(v * 100) + '%'],
                            ['height', v => Math.round(v * 100) + '%'], ['top', v => Math.round(v * 100) + '%'], ['side', v => (v > 0 ? '+' : '') + Math.round(v * 100) + '%'], ['anchor', v => Math.round(v * 100) + '%'], ['speed', v => v]]) {
      $('s-' + k).value = settings[k]; $('v-' + k).textContent = fmt(settings[k]);
    }
    $('s-rotation').value = settings.rotation;
    for (const k of ['mirror', 'center', 'commands', 'heard']) $('s-' + k).classList.toggle('on', !!settings[k]);
  }

  /** Scroll so the top of the line holding the spoken word sits at the reading line. */
  function layout(animated) {
    const frame = $('frame'), content = $('content');
    const frameH = frame.clientHeight;
    const anchorTop = Math.min(0.8, settings.anchor) * frameH;
    let lineTop = 0;
    if (spokenIdx >= 0 && spans[spokenIdx]) lineTop = spans[spokenIdx].offsetTop;
    const progressed = Math.max(0, lineTop);
    content.classList.toggle('nolerp', !animated);
    content.style.transform = `translateY(${anchorTop - progressed + dragOffset}px)`;
    // highlight: spoken words dim; words on the spoken word's line and at/before it glow.
    for (let i = 0; i < spans.length; i++) {
      const s = spans[i]; if (!s) continue;
      const cls = i <= spokenIdx ? (s.offsetTop === lineTop ? 'w current' : 'w spoken') : 'w';
      if (s.className !== cls) s.className = cls;
    }
  }
  window.addEventListener('resize', () => { applySettings(); layout(false); });

  // ---------- transcripts ----------
  function handleTranscript(text) {
    if (settings.heard) { const words = text.trim().split(/\s+/); $('heard').textContent = '🎤 …' + words.slice(-8).join(' '); $('heard').className = ''; }
    if (settings.commands) {
      const cmd = commands.detect(text);
      if (cmd) {
        if (cmd === 'start') { matcher.reset(); spokenIdx = -1; }
        else if (cmd === 'end') { const n = matcher.tokens.length - 1; matcher.seek(n); spokenIdx = n; }
        else if (cmd === 'back') goBackParagraph();
        dragOffset = 0; layout(true); restartRecognition(); return;
      }
    }
    const r = matcher.update(text);
    if (r) { spokenIdx = r.tokenIndex; dragOffset = 0; layout(true); }
  }
  function goBackParagraph() {
    const paras = matcher.lineParagraphs; if (!paras.length) return;
    const line = spokenIdx >= 0 ? matcher.tokenLine[spokenIdx] : 0;
    const para = paras[line], start = paras.indexOf(para);
    let target = 0;
    if (line > start) target = start; else if (para > 0) target = paras.indexOf(para - 1);
    const tok = matcher.lineTokenRanges[target][0];
    matcher.seek(tok - 1); spokenIdx = Math.max(-1, tok - 1);
  }

  // ---------- speech ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function startListening() {
    if (!SR) { warn('Speech recognition isn’t available in this browser. On iPad, use Safari (iOS 14.5 or later) with Siri & Dictation enabled.'); listening = false; updateListenUI(); return; }
    listening = true; updateListenUI(); startRecognition();
  }
  function stopListening() { listening = false; updateListenUI(); if (recognition) { const r = recognition; recognition = null; try { r.abort(); } catch {} } }
  function startRecognition() {
    if (!listening) return;
    const rec = new SR();
    rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
    rec.onresult = e => {
      let text = '';
      for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript + ' ';
      handleTranscript(text);
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { warn('Microphone access was denied. Allow it in Settings → Safari → Microphone, then reload.'); stopListening(); }
    };
    rec.onend = () => { if (listening && recognition === rec) { recognition = null; setTimeout(startRecognition, 30); } };
    recognition = rec;
    try { rec.start(); } catch (err) { warn('Could not start listening: ' + err.message); }
  }
  function restartRecognition() { if (!listening) return; const r = recognition; recognition = null; try { r && r.abort(); } catch {} setTimeout(startRecognition, 30); }
  function warn(msg) { $('heard').textContent = '⚠️ ' + msg; $('heard').className = 'warn'; $('heard').style.display = ''; }
  function updateListenUI() { $('listenBtn').classList.toggle('on', listening); $('playBtn').style.display = listening ? 'none' : ''; }

  // ---------- manual scroll ----------
  let raf = null, lastT = 0;
  function tickAuto(t) {
    if (!autoScrolling) return;
    if (lastT) dragOffset -= settings.speed * (t - lastT) / 1000;
    lastT = t; layout(false); raf = requestAnimationFrame(tickAuto);
  }
  $('playBtn').onclick = () => { autoScrolling = !autoScrolling; $('playBtn').textContent = autoScrolling ? '❚❚' : '▶'; lastT = 0; if (autoScrolling) raf = requestAnimationFrame(tickAuto); };

  // touch drag on the stage; a tap toggles the controls
  let touchY = null, moved = false;
  const stage = $('stage');
  stage.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; moved = false; }, { passive: true });
  stage.addEventListener('touchmove', e => {
    if (touchY == null) return;
    const dy = e.touches[0].clientY - touchY; touchY = e.touches[0].clientY;
    if (Math.abs(dy) > 0) { moved = true; dragOffset += dy; layout(false); }
  }, { passive: true });
  stage.addEventListener('touchend', () => { if (!moved) { controlsVisible = !controlsVisible; $('overlay').classList.toggle('hidden', !controlsVisible); } touchY = null; });
  stage.addEventListener('click', () => { if (!('ontouchstart' in window)) { controlsVisible = !controlsVisible; $('overlay').classList.toggle('hidden', !controlsVisible); } });

  // ---------- buttons ----------
  $('listenBtn').onclick = () => { settings.listen = !listening; saveSettings(); if (listening) stopListening(); else startListening(); };
  $('restartBtn').onclick = () => { matcher.reset(); spokenIdx = -1; dragOffset = 0; layout(true); restartRecognition(); };
  $('closeBtn').onclick = () => { stopListening(); autoScrolling = false; show('library'); };
  $('settingsBtn').onclick = () => $('settings').classList.add('open');
  $('settingsDone').onclick = () => $('settings').classList.remove('open');
  for (const k of ['font', 'spacing', 'width', 'height', 'top', 'side', 'anchor', 'speed']) {
    $('s-' + k).addEventListener('input', e => { settings[k] = Number(e.target.value); saveSettings(); applySettings(); layout(false); });
  }
  $('s-rotation').onchange = e => { settings.rotation = Number(e.target.value); saveSettings(); applySettings(); layout(false); };
  for (const k of ['mirror', 'center', 'commands', 'heard']) {
    $('s-' + k).onclick = () => { settings[k] = !settings[k]; saveSettings(); applySettings(); layout(false); };
  }
})();
</script>
</body>
</html>
